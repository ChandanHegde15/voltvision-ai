name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # Critical checks only: syntax errors and undefined names.
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only wheels keep the install small and fast; no GPU is used in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The ImageNet ResNet18 weights are downloaded once and reused across runs.
      - name: Cache pretrained weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-weights-resnet18-v1

      # Tests use temporary files only. The MVTec AD dataset (CC BY-NC-SA 4.0)
      # is never downloaded, cached or uploaded by CI.
      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t voltvision-api .
      # No dataset or artifacts are mounted, so liveness must work and
      # readiness must report 503 (not crash) - the same "demo mode" contract
      # as the Streamlit app.
      - name: Smoke test the container
        run: |
          docker run -d --name vv -p 8000:8000 voltvision-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = "503"
      - name: Show container logs on failure
        if: failure()
        run: docker logs vv
