name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # Critical checks only: syntax errors and undefined names.
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only wheels keep the install small and fast; no GPU is used in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The ImageNet ResNet18 weights are downloaded once and reused across runs.
      - name: Cache pretrained weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch
          key: torch-weights-resnet18-v1

      # Tests use temporary files only. The MVTec AD dataset (CC BY-NC-SA 4.0)
      # is never downloaded, cached or uploaded by CI.
      - name: Run tests
        run: python -m pytest -q
